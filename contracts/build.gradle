plugins {
    id 'java'
    id 'maven-publish'
}

group = 'uk.gov.justice.laa'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'jakarta.validation:jakarta.validation-api:3.1.0'
}

publishing {
    publications {
        contracts(MavenPublication) {
            groupId = 'uk.gov.justice.laa'
            artifactId = 'laa-data-user-api-contracts'
            from components.java
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri('https://maven.pkg.github.com/ministryofjustice/laa-data-user-api')
            credentials {
                username = System.getenv('GITHUB_ACTOR') ?: project.findProperty('gpr.user')
                password = System.getenv('GITHUB_TOKEN') ?: project.findProperty('gpr.token')
            }
        }
    }
}
