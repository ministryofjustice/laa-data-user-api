plugins {
    id 'uk.gov.justice.service.laa.laa-java-gradle-plugin' version '3.1.3'
    id 'uk.gov.justice.service.laa.laa-spring-boot-gradle-plugin' version '3.1.3'
    id "io.sentry.jvm.gradle" version "6.23.0"
}

sentry {
  includeSourceContext = true

  org = "ministryofjustice"
  projectName = "laa-data-user-api"
  authToken = System.getenv("SENTRY_AUTH_TOKEN")

  autoInstallation {
    sentryVersion = "8.49.0"
    enabled = true
  }
}

group = 'uk.gov.justice.laa'
version = '0.0.1-SNAPSHOT'

ext {
    springDocVersion = "3.0.0"
    testcontainersVersion = "1.21.4"

}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

sourceSets {
    pactTest {
        java {
            srcDir 'src/pactTest/java'
        }
        resources {
            srcDir 'src/pactTest/resources'
        }
        compileClasspath += sourceSets.main.output + sourceSets.test.output
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    pactTestImplementation.extendsFrom testImplementation
    pactTestRuntimeOnly.extendsFrom testRuntimeOnly
}

repositories {
    mavenCentral()
}

// Fix vulns - remove when upgrades resolve these
// Snyk: netty-codec-http, http3, quic (high/medium) - overrides the Boot BOM so all io.netty modules stay aligned
ext['netty.version'] = '4.2.18.Final'

dependencyManagement {
    dependencies {
        // CVE-2026-76183
        dependencySet(group: 'org.apache.tomcat.embed', version: '11.0.27') {
            entry 'tomcat-embed-core'
            entry 'tomcat-embed-el'
            entry 'tomcat-embed-websocket'
        }

        // SNYK-JAVA-IONETTY-21755444
        dependency 'io.netty:netty-tcnative-boringssl-static:2.0.85.Final'

        // Snyk: jackson-databind (critical/high/medium), jackson-core (high/medium)
        dependencySet(group: 'com.fasterxml.jackson.core', version: '2.21.8') {
            entry 'jackson-databind'
            entry 'jackson-core'
        }
        dependencySet(group: 'tools.jackson.core', version: '3.2.4') {
            entry 'jackson-databind'
            entry 'jackson-core'
        }
        // Snyk: logback-classic directory traversal advisories
        dependencySet(group: 'ch.qos.logback', version: '1.6.5') {
            entry 'logback-classic'
            entry 'logback-core'
        }
        // Snyk: postgresql (high/medium)
        dependency 'org.postgresql:postgresql:42.7.14'
        // Snyk: proton-j (6 high)
        dependency 'org.apache.qpid:proton-j:0.35.0'
        // Snyk: hibernate-validator EL injection (medium)
        dependency 'org.hibernate.validator:hibernate-validator:9.1.6.Final'
        // Snyk: asm (5 medium)
        dependency 'org.ow2.asm:asm:9.11.1'
        // Snyk: guava (high), commons-compress (high/medium), plexus-utils (medium)
        dependency 'com.google.guava:guava:33.7.2-jre'
        dependency 'org.apache.commons:commons-compress:1.26.0'
        dependency 'org.codehaus.plexus:plexus-utils:3.6.1'
    }
}

dependencies {
    implementation project(':contracts')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.retry:spring-retry:2.0.13'
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springDocVersion}"
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.22'
    implementation 'io.sentry:sentry-spring-boot-4:8.43.2'
    implementation('com.azure.spring:spring-cloud-azure-starter-active-directory:7.4.0') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-jackson2'
        exclude group: 'com.fasterxml.jackson.core'
    }
    implementation 'com.azure:azure-identity'
    implementation 'org.modelmapper:modelmapper:3.2.8'
    implementation 'org.postgresql:postgresql'

    implementation platform('software.amazon.awssdk:bom:2.56.0')

    implementation 'software.amazon.awssdk:sqs'
    implementation 'software.amazon.awssdk:ssm'
    implementation 'software.amazon.awssdk:sts'

    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'

    // Utilities & Core Framework Enhancements
    implementation 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'org.apache.httpcomponents.client5:httpclient5'

    runtimeOnly 'org.springframework.boot:spring-boot-properties-migrator'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Database Testcontainers Layer
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation "org.testcontainers:postgresql:${testcontainersVersion}"
    testImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"
    testImplementation "org.testcontainers:testcontainers:${testcontainersVersion}"

    pactTestImplementation 'au.com.dius.pact.provider:spring7:4.7.0-beta.3'

}

test {
    useJUnitPlatform()
    testLogging {
        showStandardStreams = true
        events "failed", "skipped", "standard_out", "standard_error"
    }

}

sourceSets {
    pactTest {
        java.srcDir 'src/pactTest/java'
        resources.srcDir 'src/pactTest/resources'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    pactTestImplementation.extendsFrom testImplementation
    pactTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    pactTestImplementation 'au.com.dius.pact.provider:junit5:4.6.17'
}

tasks.register('pactTest', Test) {
    description = 'Verifies consumer contracts against the API over HTTP.'
    group = 'verification'
    testClassesDirs = sourceSets.pactTest.output.classesDirs
    classpath = sourceSets.pactTest.runtimeClasspath
    useJUnitPlatform()

    def pactFolder = providers.gradleProperty('pactFolder')
    if (pactFolder.isPresent()) {
        systemProperty 'pactFolder', file(pactFolder.get()).absolutePath
        exclude '**/UserDataApiProviderPactTests.class'
    } else {
        exclude '**/UserDataApiLocalProviderPactTests.class'
    }
    [
        'pactbroker.url': 'PACT_BROKER_URL',
        'pactbroker.auth.username': 'PACT_BROKER_USERNAME',
        'pactbroker.auth.password': 'PACT_BROKER_PASSWORD',
        'pact.provider.version': 'GIT_SHA',
        'pact.provider.branch': 'GIT_BRANCH'
    ].each { property, variable ->
        def value = providers.environmentVariable(variable)
        if (value.isPresent()) {
            systemProperty property, value.get()
        }
    }
    def consumer = providers.environmentVariable('PACT_CONSUMER').orElse('').get()
    def consumerBranch = providers.environmentVariable('PACT_CONSUMER_BRANCH').orElse('').get()
    if (consumer && consumerBranch) {
        systemProperty 'pactbroker.consumerversionselectors.rawjson',
                groovy.json.JsonOutput.toJson([[consumer: consumer, branch: consumerBranch]])
    }
    systemProperty 'pact.verifier.publishResults',
            !pactFolder.isPresent() && providers.environmentVariable('CI').orElse('false').get() == 'true'
    outputs.upToDateWhen { false }
}

tasks.register('pactTest', Test) {
    description = 'Verifies consumer contracts fetched from the Pact broker.'
    group = 'verification'
    testClassesDirs = sourceSets.pactTest.output.classesDirs
    classpath = sourceSets.pactTest.runtimeClasspath
    useJUnitPlatform()
    include '**/UserDataApiProviderPactTests.class'

    systemProperty 'pact.provider.version', System.getenv('GIT_SHA') ?: project.version
    systemProperty 'pact.provider.branch', System.getenv('GIT_BRANCH') ?: 'main'
    systemProperty 'pact.verifier.publishResults', 'true'
    // The JUnit loader and Pact client use different property namespaces.
    systemProperty 'pactbroker.url', System.getenv('PACT_BROKER_URL')
    systemProperty 'pactbroker.auth.username', System.getenv('PACT_BROKER_USERNAME')
    systemProperty 'pactbroker.auth.password', System.getenv('PACT_BROKER_PASSWORD')
    systemProperty 'pact.broker.url', System.getenv('PACT_BROKER_URL')
    systemProperty 'pact.broker.auth.username', System.getenv('PACT_BROKER_USERNAME')
    systemProperty 'pact.broker.auth.password', System.getenv('PACT_BROKER_PASSWORD')

    def consumer = System.getenv('PACT_CONSUMER')
    def consumerBranch = System.getenv('PACT_CONSUMER_BRANCH')
    def selectors = [[mainBranch: true], [matchingBranch: true]]
    if (consumer && consumerBranch) {
        selectors << [pacticipant: consumer, branch: consumerBranch]
    }
    systemProperty 'pactbroker.consumerversionselectors.rawjson',
            groovy.json.JsonOutput.toJson(selectors)

    doFirst {
        def mockitoAgent = configurations.pactTestRuntimeClasspath.find { it.name.contains('mockito-core') }
        if (mockitoAgent) {
            jvmArgs "-javaagent:${mockitoAgent}", '-Xshare:off'
        }
    }

    testLogging {
        showStandardStreams = true
        events "failed", "skipped", "standard_out", "standard_error"
    }
}

tasks.register('pactLocalTest', Test) {
    description = 'Verifies local consumer pacts from the folder supplied with -PpactFolder.'
    group = 'verification'
    testClassesDirs = sourceSets.pactTest.output.classesDirs
    classpath = sourceSets.pactTest.runtimeClasspath
    useJUnitPlatform()
    include '**/UserDataApiLocalPactTests.class'

    def pactFolder = findProperty('pactFolder')
    systemProperty 'pactfolder.path', pactFolder ?: ''

    doFirst {
        if (!pactFolder || !file(pactFolder).isDirectory()) {
            throw new GradleException('Set -PpactFolder to an existing directory containing Pact files.')
        }
    }

    testLogging {
        showStandardStreams = true
        events "failed", "skipped", "standard_out", "standard_error"
    }
}
