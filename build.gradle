plugins {
    id 'uk.gov.justice.service.laa.laa-java-gradle-plugin' version '3.1.3'
    id 'uk.gov.justice.service.laa.laa-spring-boot-gradle-plugin' version '3.1.3'
    id "io.sentry.jvm.gradle" version "6.23.0"
}

sentry {
  includeSourceContext = true

  org = "ministryofjustice"
  projectName = "laa-data-user-api"
  authToken = System.getenv("SENTRY_AUTH_TOKEN")

  autoInstallation {
    sentryVersion = "8.49.0"
    enabled = true
  }
}

group = 'uk.gov.justice.laa'
version = '0.0.1-SNAPSHOT'

ext {
    springDocVersion = "3.0.0"
    testcontainersVersion = "1.20.6"

}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

// Fix vulns - remove when upgrades resolve these
dependencyManagement {
    dependencies {
        // CVE-2026-76183
        dependencySet(group: 'org.apache.tomcat.embed', version: '11.0.27') {
            entry 'tomcat-embed-core'
            entry 'tomcat-embed-el'
            entry 'tomcat-embed-websocket'
        }

        // SNYK-JAVA-IONETTY-21755444
        dependency 'io.netty:netty-tcnative-boringssl-static:2.0.84.Final'
    }
}

dependencies {
    implementation project(':contracts')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.retry:spring-retry:2.0.13'
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springDocVersion}"
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.22'
    implementation 'tools.jackson.dataformat:jackson-dataformat-csv:3.0.3'
    implementation 'io.sentry:sentry-spring-boot-4:8.43.2'
    implementation('com.azure.spring:spring-cloud-azure-starter-active-directory:7.4.0') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-jackson2'
        exclude group: 'com.fasterxml.jackson.core'
    }
    implementation 'com.azure:azure-identity'
    implementation 'org.modelmapper:modelmapper:3.2.6'
    implementation 'org.postgresql:postgresql'

    implementation platform('software.amazon.awssdk:bom:2.56.0')

    implementation 'software.amazon.awssdk:sqs'
    implementation 'software.amazon.awssdk:ssm'
    implementation 'software.amazon.awssdk:sts'

    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'

    // Utilities & Core Framework Enhancements
    implementation 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'org.apache.httpcomponents.client5:httpclient5'

    runtimeOnly 'org.springframework.boot:spring-boot-properties-migrator'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Database Testcontainers Layer
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation "org.testcontainers:postgresql:${testcontainersVersion}"
    testImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"
    testImplementation "org.testcontainers:testcontainers:${testcontainersVersion}"

}

test {
    useJUnitPlatform()
    testLogging {
        showStandardStreams = true
        events "failed", "skipped", "standard_out", "standard_error"
    }

}

sourceSets {
    pactTest {
        java.srcDir 'src/pactTest/java'
        resources.srcDir 'src/pactTest/resources'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    pactTestImplementation.extendsFrom testImplementation
    pactTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    pactTestImplementation 'au.com.dius.pact.provider:junit5:4.6.17'
}

tasks.register('pactTest', Test) {
    description = 'Verifies consumer contracts against the API over HTTP.'
    group = 'verification'
    testClassesDirs = sourceSets.pactTest.output.classesDirs
    classpath = sourceSets.pactTest.runtimeClasspath
    useJUnitPlatform()

    def pactFolder = providers.gradleProperty('pactFolder')
    if (pactFolder.isPresent()) {
        systemProperty 'pactFolder', file(pactFolder.get()).absolutePath
        exclude '**/UserDataApiProviderPactTests.class'
    } else {
        exclude '**/UserDataApiLocalProviderPactTests.class'
    }
    [
        'pactbroker.url': 'PACT_BROKER_URL',
        'pactbroker.auth.username': 'PACT_BROKER_USERNAME',
        'pactbroker.auth.password': 'PACT_BROKER_PASSWORD',
        'pact.provider.version': 'GIT_SHA',
        'pact.provider.branch': 'GIT_BRANCH'
    ].each { property, variable ->
        def value = providers.environmentVariable(variable)
        if (value.isPresent()) {
            systemProperty property, value.get()
        }
    }
    def consumer = providers.environmentVariable('PACT_CONSUMER').orElse('').get()
    def consumerBranch = providers.environmentVariable('PACT_CONSUMER_BRANCH').orElse('').get()
    if (consumer && consumerBranch) {
        systemProperty 'pactbroker.consumerversionselectors.rawjson',
                groovy.json.JsonOutput.toJson([[consumer: consumer, branch: consumerBranch]])
    }
    systemProperty 'pact.verifier.publishResults',
            !pactFolder.isPresent() && providers.environmentVariable('CI').orElse('false').get() == 'true'
    outputs.upToDateWhen { false }
}
