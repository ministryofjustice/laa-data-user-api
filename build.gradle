plugins {
    id 'uk.gov.justice.service.laa.laa-java-gradle-plugin' version '4.0.0'
    id 'org.springframework.boot' version '4.1.3'
    id 'uk.gov.justice.service.laa.laa-spring-boot-gradle-plugin' version '3.1.3'
    id "io.sentry.jvm.gradle" version "6.23.0"
}

sentry {
  includeSourceContext = true

  org = "ministryofjustice"
  projectName = "laa-data-user-api"
  authToken = System.getenv("SENTRY_AUTH_TOKEN")

  autoInstallation {
    sentryVersion = "8.49.0"
    enabled = true
  }
}

group = 'uk.gov.justice.laa'
version = '0.0.1-SNAPSHOT'

ext {
    springDocVersion = "3.2.0"
    testcontainersVersion = "1.21.4"

}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

configurations.configureEach {
    // The LAA BOM still manages Spring Boot 4.1.1; align its modules with the patched Gradle plugin.
    resolutionStrategy.eachDependency {
        if (requested.group == 'org.springframework.boot' && requested.name != 'spring-boot-dependencies') {
            useVersion '4.1.3'
        }
    }
}

repositories {
    mavenCentral()
}

// Fix vulns - remove when upgrades resolve these
// Snyk: netty-codec-http, http3, quic (high/medium) - overrides the Boot BOM so all io.netty modules stay aligned
ext['netty.version'] = '4.2.18.Final'
ext['spring-framework.version'] = '7.0.11'
ext['spring-security.version'] = '7.1.3'

dependencyManagement {
    dependencies {
        // CVE-2026-76183
        dependencySet(group: 'org.apache.tomcat.embed', version: '11.0.27') {
            entry 'tomcat-embed-core'
            entry 'tomcat-embed-el'
            entry 'tomcat-embed-websocket'
        }

        // SNYK-JAVA-IONETTY-21755444
        dependency 'io.netty:netty-tcnative-boringssl-static:2.0.85.Final'

        // Snyk: jackson-databind (critical/high/medium), jackson-core (high/medium)
        dependencySet(group: 'com.fasterxml.jackson.core', version: '2.23.0') {
            entry 'jackson-databind'
            entry 'jackson-core'
        }
        dependencySet(group: 'tools.jackson.core', version: '3.3.0') {
            entry 'jackson-databind'
            entry 'jackson-core'
        }
        // Snyk: logback-classic directory traversal advisories
        dependencySet(group: 'ch.qos.logback', version: '1.6.5') {
            entry 'logback-classic'
            entry 'logback-core'
        }
        // Snyk: postgresql (high/medium)
        dependency 'org.postgresql:postgresql:42.7.14'
        // Snyk: proton-j (6 high)
        dependency 'org.apache.qpid:proton-j:0.35.0'
        // Snyk: hibernate-validator EL injection (medium)
        dependency 'org.hibernate.validator:hibernate-validator:9.1.6.Final'
        // Snyk: asm (5 medium)
        dependency 'org.ow2.asm:asm:9.11.1'
        dependencySet(group: 'net.minidev', version: '2.6.1') {
            entry 'json-smart'
            entry 'accessors-smart'
        }
        // Snyk: guava (high), commons-compress (high/medium), plexus-utils (medium)
        dependency 'com.google.guava:guava:33.7.2-jre'
        dependency 'org.apache.commons:commons-compress:1.26.0'
        dependency 'org.codehaus.plexus:plexus-utils:3.6.1'
    }
}

dependencies {
    constraints {
        testRuntimeOnly 'org.objenesis:objenesis:3.6'
    }

    implementation project(':contracts')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.retry:spring-retry:2.0.13'
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springDocVersion}"
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.22'
    implementation 'io.sentry:sentry-spring-boot-4:8.43.2'
    implementation('com.azure.spring:spring-cloud-azure-starter-active-directory:7.4.0') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-jackson2'
        exclude group: 'com.fasterxml.jackson.core'
    }
    implementation 'com.azure:azure-identity'
    implementation 'org.modelmapper:modelmapper:3.2.8'
    implementation 'org.postgresql:postgresql'

    implementation platform('software.amazon.awssdk:bom:2.57.12')

    implementation 'software.amazon.awssdk:sqs'
    implementation 'software.amazon.awssdk:ssm'
    implementation 'software.amazon.awssdk:sts'

    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'

    // Utilities & Core Framework Enhancements
    implementation 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'org.apache.httpcomponents.client5:httpclient5'

    runtimeOnly 'org.springframework.boot:spring-boot-properties-migrator'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Database Testcontainers Layer
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation "org.testcontainers:postgresql:${testcontainersVersion}"
    testImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"
    testImplementation "org.testcontainers:testcontainers:${testcontainersVersion}"

}

test {
    useJUnitPlatform()
    testLogging {
        showStandardStreams = true
        events "failed", "skipped", "standard_out", "standard_error"
    }
}
