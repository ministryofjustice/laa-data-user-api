{{- $dashboardName := .Values.grafanaDashboard.name | default (printf "%s-dashboard" .Release.Namespace) -}}
{{- $dashboardNamespace := .Values.grafanaDashboard.namespace | default .Release.Namespace -}}
{{- $dashboardJson := .Files.Get "files/grafana-dashboard.json" -}}
{{- $dashboardJson = $dashboardJson | replace "laa-data-user-api-dev" .Release.Namespace -}}
{{- $dashboardJson = $dashboardJson | replace "cloud-platform-faeb1d14a7275a64" .Values.rdsDbIdentifier -}}
{{- $dashboardJson = $dashboardJson | replace "LAA Data User API (dev) dashboard" (printf "LAA Data User API (%s) dashboard" .Values.envName) -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $dashboardName }}
  namespace: {{ $dashboardNamespace }}
  labels:
    grafana_dashboard: {{ $dashboardName }}
data:
  {{ printf "%s.json" $dashboardName }}: |
{{ $dashboardJson | nindent 4 }}
