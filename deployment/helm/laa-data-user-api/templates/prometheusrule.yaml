apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: prometheus-custom-rules-{{ .Release.Namespace }}
  namespace: {{ .Release.Namespace }}
  labels:
    role: alert-rules
    prometheus: prometheus-operator
    release: prometheus-operator
spec:
  groups:
    - name: meta-rules
      rules:
        - record: is_alert_hours
          expr: hour() >= 6 and hour() < 20 #alerts are silenced between 20:00–05:59 UTC (which is 21:00–06:59 BST). Alerts fire between 06:00–19:59 UTC (07:00–20:59 BST).

    - name: kubernetes-rules
      rules:
        - alert: KubePodNotReady
          annotations:
            message: Pod {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.pod {{ "}}" }} in {{ .Values.envName }} has been in a non-ready
              state for longer than fifteen minutes.
            runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubepodnotready
            dashboard_url: "https://grafana.live.cloud-platform.service.justice.gov.uk/d/{{ .Release.Namespace }}"
          expr: sum by (namespace, pod) (kube_pod_status_phase{job="kube-state-metrics",phase!~"Running|Succeeded", namespace="{{ .Release.Namespace }}"}) > 0
          for: 15m
          labels:
            severity: warning

        - alert: KubePodCrashLooping
          annotations:
            message: Pod {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.pod {{ "}}" }} ({{ "{{" }} $labels.container {{ "}}" }}) in {{ .Values.envName }} is restarting excessively
            runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubepodcrashlooping
            dashboard_url: "https://grafana.live.cloud-platform.service.justice.gov.uk/d/{{ .Release.Namespace }}"
          expr: rate(kube_pod_container_status_restarts_total{job="kube-state-metrics", namespace="{{ .Release.Namespace }}"}[10m]) * 60 * 10 > 1
          for: 5m
          labels:
            severity: critical

        - alert: KubeNamespaceQuotaNearing
          annotations:
            message: Namespace {{ "{{" }} $labels.namespace {{ "}}" }} is using {{ "{{" }} printf "%0.0f" $value {{ "}}" }}% of its {{ "{{" }} $labels.resource {{ "}}" }} quota.
            runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubequotaexceeded
            dashboard_url: "https://grafana.live.cloud-platform.service.justice.gov.uk/d/{{ .Release.Namespace }}"
          expr: |-
            100 * kube_resourcequota{job="kube-state-metrics", type="used", namespace="{{ .Release.Namespace }}"}
              / ignoring(instance, job, type)
            (kube_resourcequota{job="kube-state-metrics", type="hard", namespace="{{ .Release.Namespace }}"} > 0)
              > 80
          for: 5m
          labels:
            severity: warning

        - alert: KubeJobFailed
          annotations:
            message: Failed Cron Job in {{ "{{" }} $labels.namespace {{ "}}" }}/{{ "{{" }} $labels.job_name {{ "}}" }} in {{ .Values.envName }}
            runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubejobfailed
            dashboard_url: "https://grafana.live.cloud-platform.service.justice.gov.uk/d/{{ .Release.Namespace }}"
          expr: kube_job_status_failed{job="kube-state-metrics", namespace="{{ .Release.Namespace }}"}  > 0
          for: 1h
          labels:
            severity: warning

        - alert: KubeDeploymentGenerationMismatch
          annotations:
            message: Deployment generation mismatch in {{ "{{" }} $labels.namespace {{ "}}" }} due to possible roll-back.
            runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md#alert-name-kubedeploymentgenerationmismatch
            dashboard_url: "https://grafana.live.cloud-platform.service.justice.gov.uk/d/{{ .Release.Namespace }}"
          expr: (kube_deployment_status_observed_generation{job="kube-state-metrics",namespace="{{ .Release.Namespace }}"} != kube_deployment_metadata_generation{job="kube-state-metrics",namespace="{{ .Release.Namespace }}"})
          for: 15m
          labels:
            severity: warning

        - alert: KubeDeploymentReplicasMismatch
          annotations:
            message: Deployment in {{ "{{" }} $labels.namespace {{ "}}" }} has not matched the expected number of replicas.
            runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/blob/master/runbook.md#alert-name-kubedeploymentreplicasmismatch
            dashboard_url: "https://grafana.live.cloud-platform.service.justice.gov.uk/d/{{ .Release.Namespace }}"
          expr: (kube_deployment_spec_replicas{job="kube-state-metrics",namespace="{{ .Release.Namespace }}"} != kube_deployment_status_replicas_available{job="kube-state-metrics",namespace="{{ .Release.Namespace }}"})
          for: 15m
          labels:
            severity: warning

    - name: application-rules
      rules:
        - alert: nginx-SlowResponses
          annotations:
            message: Ingress in {{ .Values.envName }} is serving slow responses over 2 seconds.
            dashboard_url: "https://grafana.live.cloud-platform.service.justice.gov.uk/d/{{ .Release.Namespace }}"
          expr: |-
            avg(rate(nginx_ingress_controller_request_duration_seconds_sum{exported_namespace = "{{ .Release.Namespace }}"}[5m])
            /
            rate(nginx_ingress_controller_request_duration_seconds_count{exported_namespace = "{{ .Release.Namespace }}"}[5m]) > 0) by (ingress) >2
          for: 1m
          labels:
            severity: warning

        - alert: 5xxErrorResponses
          annotations:
            message: Ingress in {{ .Values.envName }} is serving 5XX responses.
            dashboard_url: "https://grafana.live.cloud-platform.service.justice.gov.uk/d/{{ .Release.Namespace }}"
          expr: sum(rate(nginx_ingress_controller_requests{exported_namespace="{{ .Release.Namespace }}", status=~"5.*"}[5m]))*270 > 10
          for: 1m
          labels:
            severity: critical

        - alert: 4xxErrorResponses
          annotations:
            message: Ingress in {{ .Values.envName }} is serving 4XX responses. (Ignoring 403s from GDS)
            dashboard_url: "https://grafana.live.cloud-platform.service.justice.gov.uk/d/{{ .Release.Namespace }}"
          expr: |-
            (
              sum(rate(nginx_ingress_controller_requests{exported_namespace="{{ .Release.Namespace }}", status=~"4.*"}[5m]))
              -
              sum(rate(nginx_ingress_controller_requests{exported_namespace="{{ .Release.Namespace }}", status="403", remote_addr=~"52.17.9.21|52.17.98.131"}[5m]))
            ) * 270 > 10
          for: 1m
          labels:
            severity: warning

        - alert: ContainerMemoryUsageHigh
          annotations:
            message: Memory usage compared to the memory limit on the container in {{ .Values.envName }} is more than 85% for 5m
            dashboard_url: "https://grafana.live.cloud-platform.service.justice.gov.uk/d/{{ .Release.Namespace }}"
          expr: |-
            (sum(container_memory_working_set_bytes{namespace="{{ .Release.Namespace }}", container="laa-data-user-api", image!=""})
            /
            sum(kube_pod_container_resource_limits{namespace="{{ .Release.Namespace }}", container="laa-data-user-api", unit="byte"})) * 100 > 85
          for: 5m
          labels:
            severity: warning

    - name: database-rules
      rules:
        - alert: RDSHighCPU
          annotations:
            message: CPU usage for the RDS instance in {{ "{{" }} $labels.namespace {{ "}}" }} over 75%
            dashboard_url: "https://grafana.live.cloud-platform.service.justice.gov.uk/d/{{ .Release.Namespace }}"
          expr: |
            (
              is_alert_hours
              AND
              aws_rds_cpuutilization_average{dbinstance_identifier="{{ .Values.rdsDbIdentifier }}"} > 75
            )
            OR
            (
              aws_rds_cpuutilization_average{dbinstance_identifier="{{ .Values.rdsDbIdentifier }}", environment="prod"} > 75
            )
          for: 1m
          labels:
            severity: warning

        - alert: RDSLowStorage
          annotations:
            message: Free storage space for the RDS instance in {{ "{{" }} $labels.namespace {{ "}}" }} is less than 1GB
            dashboard_url: "https://grafana.live.cloud-platform.service.justice.gov.uk/d/{{ .Release.Namespace }}"
          expr: |
            (
              is_alert_hours
              AND
              aws_rds_free_storage_space_average{dbinstance_identifier="{{ .Values.rdsDbIdentifier }}"} < 1024*1024*1024
            )
            OR
            (
              aws_rds_free_storage_space_average{dbinstance_identifier="{{ .Values.rdsDbIdentifier }}", environment="prod"} < 1024*1024*1024
            )
          for: 1m
          labels:
            severity: critical

        - alert: RDSHighReadLatency
          annotations:
            message: Read latency for the RDS instance in {{ "{{" }} $labels.namespace {{ "}}" }} is over 0.5 seconds
            dashboard_url: "https://grafana.live.cloud-platform.service.justice.gov.uk/d/{{ .Release.Namespace }}"
          expr: |
            (
              is_alert_hours
              AND
              aws_rds_read_latency_average{dbinstance_identifier="{{ .Values.rdsDbIdentifier }}"} > 0.5
            )
            OR
            (
              aws_rds_read_latency_average{dbinstance_identifier="{{ .Values.rdsDbIdentifier }}", environment="prod"} > 0.5
            )
          for: 1m
          labels:
            severity: warning

        - alert: RDSHighWriteLatency
          annotations:
            message: Write latency for the RDS instance in {{ "{{" }} $labels.namespace {{ "}}" }} is over 0.5 seconds
            dashboard_url: "https://grafana.live.cloud-platform.service.justice.gov.uk/d/{{ .Release.Namespace }}"
          expr: |
            (
              is_alert_hours
              AND
              aws_rds_write_latency_average{dbinstance_identifier="{{ .Values.rdsDbIdentifier }}"} > 0.5
            )
            OR
            (
              aws_rds_write_latency_average{dbinstance_identifier="{{ .Values.rdsDbIdentifier }}", environment="prod"} > 0.5
            )
          for: 1m
          labels:
            severity: warning

        - alert: RDSLowFreeableMemory
          annotations:
            message: Freeable memory for the RDS instance in {{ "{{" }} $labels.namespace {{ "}}" }} is less than {{ .Values.rdsLowFreeableMemoryTriggerMb }}MB
            dashboard_url: "https://grafana.live.cloud-platform.service.justice.gov.uk/d/{{ .Release.Namespace }}"
          expr: |
            (
              is_alert_hours
              AND
              aws_rds_freeable_memory_average{dbinstance_identifier="{{ .Values.rdsDbIdentifier }}"} < {{ .Values.rdsLowFreeableMemoryTriggerMb }}*1024*1024
            )
            OR
            (
              aws_rds_freeable_memory_average{dbinstance_identifier="{{ .Values.rdsDbIdentifier }}", environment="prod"} < {{ .Values.rdsLowFreeableMemoryTriggerMb }}*1024*1024
            )
          for: 1m
          labels:
            severity: critical

        - alert: RDSHighWriteIOPS
          annotations:
            message: Write operations for the RDS instance in {{ "{{" }} $labels.namespace {{ "}}" }} are over 300 per second
            dashboard_url: "https://grafana.live.cloud-platform.service.justice.gov.uk/d/{{ .Release.Namespace }}"
          expr: |
            (
              is_alert_hours
              AND
              aws_rds_write_iops_average{dbinstance_identifier="{{ .Values.rdsDbIdentifier }}"} > 300
            )
            OR
            (
              aws_rds_write_iops_average{dbinstance_identifier="{{ .Values.rdsDbIdentifier }}", environment="prod"} > 300
            )
          for: 1m
          labels:
            severity: warning

        - alert: RDSHighReadIOPS
          annotations:
            message: Read operations for the RDS instance in {{ "{{" }} $labels.namespace {{ "}}" }} are over 900 per second
            dashboard_url: "https://grafana.live.cloud-platform.service.justice.gov.uk/d/{{ .Release.Namespace }}"
          expr: |
            (
              is_alert_hours
              AND
              aws_rds_read_iops_average{dbinstance_identifier="{{ .Values.rdsDbIdentifier }}"} > 900
            )
            OR
            (
              aws_rds_read_iops_average{dbinstance_identifier="{{ .Values.rdsDbIdentifier }}", environment="prod"} > 900
            )
          for: 1m
          labels:
            severity: warning

        - alert: RDSHighDatabaseConnections
          annotations:
            message: Database connection count for the RDS instance in {{ "{{" }} $labels.namespace {{ "}}" }} is over 65
            dashboard_url: "https://grafana.live.cloud-platform.service.justice.gov.uk/d/{{ .Release.Namespace }}"
          expr: |
            (
              is_alert_hours
              AND
              aws_rds_database_connections_average{dbinstance_identifier="{{ .Values.rdsDbIdentifier }}"} > 65
            )
            OR
            (
              aws_rds_database_connections_average{dbinstance_identifier="{{ .Values.rdsDbIdentifier }}", environment="prod"} > 65
            )
          for: 5m
          labels:
            severity: warning
