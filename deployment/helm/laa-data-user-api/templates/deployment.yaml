apiVersion: apps/v1
kind: Deployment
metadata:
  name: laa-data-user-api
  labels:
    app: laa-data-user-api
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: laa-data-user-api
  template:
    metadata:
      labels:
        app: laa-data-user-api
      {{- if .Values.authorization.opaEnabled }}
      annotations:
        laa-data-user-api/opa-bundle-ref: {{ .Values.opa.bundleRef | quote }}
      {{- end }}
    spec:
      securityContext:
        runAsUser: 10000
        runAsNonRoot: true
      automountServiceAccountToken: false # Prevents the default service account token from being mounted, which is a security best practice when using IRSA
      containers:
        - name: laa-data-user-api
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: Always
          securityContext:
            runAsUser: 10000
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILE
              value: {{ .Values.springProfile }}
            - name: TECH_SERVICES_AZURE_SCOPE
              value: {{ .Values.techServicesAzureScope }}
            - name: TECH_SERVICES_AZURE_CLIENT_ID
              value: {{ .Values.techServicesAzureClientId }}
            - name: TECH_SERVICES_TENANT_ID
              value: {{ .Values.techServicesTenantId }}
            - name: TECH_SERVICES_AZURE_CLIENT_SECRET
              value: {{ .Values.techServicesAzureClientSecret }}
            - name: TECH_SERVICES_BASE_URL
              value: {{ .Values.techServicesBaseUrl }}
            - name: AZURE_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: laa-data-user-api-azure-tenant-secret-k8s
                  key: AZURE_TENANT_ID
            - name: AZURE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: laa-data-user-api-azure-client-id-k8s
                  key: AZURE_CLIENT_ID
            - name: AZURE_APP_URI
              value: {{ .Values.azureAppUri }}
            - name: SENTRY_DSN
              value: {{ .Values.sentryDsn }}
            - name: SENTRY_ENVIRONMENT
              value: {{ .Values.sentryEnvironment }}
            - name: SENTRY_ENABLED
              value: {{ .Values.sentryEnabled | quote }}
            - name: SENTRY_SAMPLE_RATE
              value: {{ .Values.sentrySampleRate | quote }}
            - name: OPA_URL
              value: {{ .Values.opa.url | quote }}
            - name: APP_AUTHORIZATION_LEGACY_POLICIES_ENABLED
              value: {{ .Values.authorization.legacyPoliciesEnabled | quote }}
            - name: APP_AUTHORIZATION_OPA_ENABLED
              value: {{ .Values.authorization.opaEnabled | quote }}
            - name: POSTGRES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rds-postgresql-instance-app-output
                  key: database_username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rds-postgresql-instance-app-output
                  key: database_password
            - name: POSTGRES_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: rds-postgresql-instance-app-output
                  key: database_name
            - name: POSTGRES_DB_ADDRESS
              valueFrom:
                secretKeyRef:
                  name: rds-postgresql-instance-app-output
                  key: rds_instance_address
          resources:
            requests:
              memory: "{{ .Values.resources.requests.memory }}"
              cpu: "{{ .Values.resources.requests.cpu }}"
            limits:
              memory: "{{ .Values.resources.limits.memory }}"
              cpu: "{{ .Values.resources.limits.cpu }}"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            failureThreshold: 15
            periodSeconds: 10
        {{- if .Values.authorization.opaEnabled }}
        - name: opa
          image: "{{ .Values.opa.image }}"
          imagePullPolicy: IfNotPresent
          args:
            - run
            - --server
            - --addr=127.0.0.1:8181
            - --diagnostic-addr=0.0.0.0:8182
            - --bundle
            - /bundle/bundle.tar.gz
            - --log-format=json
          ports:
            - name: opa-diagnostics
              containerPort: 8182
          readinessProbe:
            httpGet:
              path: /health?bundles=true
              port: opa-diagnostics
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 1
          securityContext:
            runAsUser: 10000
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              memory: "{{ .Values.opa.resources.requests.memory }}"
              cpu: "{{ .Values.opa.resources.requests.cpu }}"
            limits:
              memory: "{{ .Values.opa.resources.limits.memory }}"
              cpu: "{{ .Values.opa.resources.limits.cpu }}"
          volumeMounts:
            - name: opa-tmp
              mountPath: /tmp
            - name: opa-bundle
              mountPath: /bundle
              readOnly: true
      volumes:
        - name: opa-tmp
          emptyDir: {}
        - name: opa-bundle
          configMap:
            name: laa-data-user-api-opa-bundle-{{ .Values.opa.bundleRef | sha256sum | trunc 12 }}
        {{- end }}
