---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zap-config
  namespace: ${NAMESPACE}
data:
  rules.tsv: |
    90005	IGNORE	ZAP's own scanner does not send the Sec-Fetch-Dest header. This is a false positive about ZAP's own behaviour, not the server.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: zap-scan
  namespace: ${NAMESPACE}
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: default
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
      automountServiceAccountToken: false
      containers:
        - name: zap
          image: ghcr.io/zaproxy/zaproxy:stable
          imagePullPolicy: Always
          resources:
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: zap-wrk
              mountPath: /zap/wrk
            - name: home
              mountPath: /home/zap
            - name: config
              mountPath: /etc/config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          command:
            - /bin/sh
            - -c
            - zap-baseline.py -a -j -t http://laa-data-user-api.${NAMESPACE}.svc.cluster.local:8080 -c /etc/config/rules.tsv -I -w report.md && echo "===== BEGIN ZAP REPORT.MD =====" && cat /zap/wrk/report.md && echo "===== END ZAP REPORT.MD ====="
      volumes:
        - name: zap-wrk
          emptyDir: {}
        - name: home
          emptyDir: {}
        - name: config
          configMap:
            name: zap-config
      restartPolicy: Never


