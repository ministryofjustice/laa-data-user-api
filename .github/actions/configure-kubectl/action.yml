name: Configure kubectl
description: Configures a kubectl context against the Cloud Platform cluster using cert/token auth

inputs:
  kube-cert:
    description: 'Cluster CA certificate (KUBE_CERT secret)'
    required: true
  kube-token:
    description: 'Deploy user token (KUBE_TOKEN secret)'
    required: true
  kube-cluster:
    description: 'Cluster API server hostname (KUBE_CLUSTER secret)'
    required: true
  kube-namespace:
    description: 'Target namespace (KUBE_NAMESPACE secret)'
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        echo "${{ inputs.kube-cert }}" > ca.crt
        kubectl config set-cluster ${KUBE_CLUSTER} --certificate-authority=./ca.crt --server=https://${KUBE_CLUSTER}
        kubectl config set-credentials deploy-user --token=${{ inputs.kube-token }}
        kubectl config set-context ${KUBE_CLUSTER} --cluster=${KUBE_CLUSTER} --user=deploy-user --namespace=${KUBE_NAMESPACE}
        kubectl config use-context ${KUBE_CLUSTER}
      env:
        KUBE_CLUSTER: ${{ inputs.kube-cluster }}
        KUBE_NAMESPACE: ${{ inputs.kube-namespace }}
