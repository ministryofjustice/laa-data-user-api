name: Snyk Production Security Scan

on:
  schedule:
    - cron: '15 0 * * *'  # Run daily at 00:15 UTC

permissions:
  contents: read
  actions: read
  packages: read
  security-events: write

jobs:
  vulnerability-scan:
    uses: ./.github/workflows/snyk.yml
    with:
      scan_branch: prd
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SNYK_ORG_ID: ${{ secrets.SNYK_ORG_ID }}
      SNYK_SLACK_WEBHOOK_URL: ${{ secrets.SNYK_SLACK_WEBHOOK_URL }}
