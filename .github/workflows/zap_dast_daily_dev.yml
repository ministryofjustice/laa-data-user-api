name: ZAP DEV DAST Daily Baseline Scan
on:
  # schedule:
  #   - cron: '15 8 * * 1-5' # At 08:15 on Monday through Friday
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  zap_scan:
    name: Run ZAP DEV DAST Daily Baseline Scan Against Live App
    runs-on: ubuntu-latest
    environment: development
    env:
      KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure kubectl
        uses: ./.github/actions/configure-kubectl
        with:
          kube-cert: ${{ secrets.KUBE_CERT }}
          kube-token: ${{ secrets.KUBE_TOKEN }}
          kube-cluster: ${{ secrets.KUBE_CLUSTER }}
          kube-namespace: ${{ secrets.KUBE_NAMESPACE }}

      - name: Generate Deployment the Files
        run: |
          cat deployment/zap-templates/zapjob.yml | envsubst > deployment/zapjob.yml
        env:
          NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}

      - name: Apply ZAP job
        run: |
          kubectl delete job zap-scan -n "${KUBE_NAMESPACE}" --ignore-not-found
          kubectl apply -f deployment/zapjob.yml

      - name: Wait for job completion
        run: |
          kubectl wait \
            --for=condition=complete \
            job/zap-scan \
            -n "${KUBE_NAMESPACE}" \
            --timeout=900s

      - name: Get logs (debugging)
        run: |
          kubectl logs job/zap-scan -n "${KUBE_NAMESPACE}" | tee zap-output.txt

      - name: Extract report.md from logs
        shell: bash
        run: |
          awk '/^===== BEGIN ZAP REPORT\.MD =====$/ {capture=1; next} /^===== END ZAP REPORT\.MD =====$/ {capture=0; exit} capture {print}' zap-output.txt > report.md
          test -s report.md

      - name: Print report.md to stdout
        run: |
          echo "===== BEGIN ZAP report.md ====="
          cat report.md
          echo "===== END ZAP report.md ====="

      - name: Upload ZAP scan report artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-scan-report
          path: |
            report.md
            zap-output.txt

      - name: Parse summary
        run: |
          #!/bin/bash -xe

          # Read directly from the markdown file.
          # -m 1 ensures we only grab the first match (which is the summary table at the top of the report)
          high_value=$(grep -a -m 1 "| High |" report.md | awk -F'|' '{print $3}' | xargs)
          medium_value=$(grep -a -m 1 "| Medium |" report.md | awk -F'|' '{print $3}' | xargs)
          low_value=$(grep -a -m 1 "| Low |" report.md | awk -F'|' '{print $3}' | xargs)
          info_value=$(grep -a -m 1 "| Informational |" report.md | awk -F'|' '{print $3}' | xargs)
          
          # Fallback to 0 if grep returns empty (e.g., if the ZAP report is totally empty/failed)
          high_value=${high_value:-0}
          medium_value=${medium_value:-0}
          low_value=${low_value:-0}
          info_value=${info_value:-0}

          echo "ZAP_HIGH=${high_value}" >> "$GITHUB_ENV"
          echo "ZAP_MEDIUM=${medium_value}" >> "$GITHUB_ENV"
          echo "ZAP_LOW=${low_value}" >> "$GITHUB_ENV"
          echo "ZAP_INFO=${info_value}" >> "$GITHUB_ENV"

          if [[ $high_value -gt 0 ]]; then
              echo "High alerts, notification should be sent"
              echo "ZAP_SHOULD_NOTIFY=true" >> "$GITHUB_ENV"
          elif [[ $medium_value -gt 0 || $low_value -gt 0 ]]; then
              # For daily baseline runs, send summary on Wednesday if there are med/low
              if [ "$(date +%A)" = "Wednesday" ]; then
                  echo "Medium and/or low alerts on Wednesday, notification should be sent"
                  echo "ZAP_SHOULD_NOTIFY=true" >> "$GITHUB_ENV"
              else
                  echo "ZAP_SHOULD_NOTIFY=false" >> "$GITHUB_ENV"
              fi
          else
              echo "ZAP_SHOULD_NOTIFY=false" >> "$GITHUB_ENV"
          fi

      - name: Post to Slack
        if: env.ZAP_SHOULD_NOTIFY == 'true'
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        with:
          webhook: ${{ secrets.ZAP_SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "ZAP Daily Scan Report: DEV Environment"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Scan Summary:*"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":rotating_light: *HIGH:* ${{ env.ZAP_HIGH }}"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":sign-warning: *MEDIUM:* ${{ env.ZAP_MEDIUM }}"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":orange_heart: *LOW:* ${{ env.ZAP_LOW }}"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":yellow_heart: *INFORMATIONAL:* ${{ env.ZAP_INFO }}"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Please review the detailed scan results and take necessary actions. \n\n View Details on GitHub: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }

