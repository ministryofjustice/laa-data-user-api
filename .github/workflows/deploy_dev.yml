name: Deploy Dev

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  actions: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  get-allowlist:
    runs-on: ubuntu-latest
    outputs:
      allowlist: ${{ steps.generate.outputs.allowlist }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Checkout allowlist repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ministryofjustice/laa-ip-allowlist
          ref: v1.1.0
          path: laa-ip-allowlist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install allowlist dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Generate allowlist
        id: generate
        run: |
          set -o pipefail

          GROUP_ARGS=()
          IFS=';' read -ra GROUP_ARRAY < <(sed -n 's/^[[:space:]]*groups:[[:space:]]*"\(.*\)"[[:space:]]*$/\1/p' deployment/helm/laa-data-user-api/values-dev.yaml)
          for group in "${GROUP_ARRAY[@]}"; do
            # shellcheck disable=SC2086 # intentional word-splitting: filter_cidrs.py --group takes each tag as a separate arg
            GROUP_ARGS+=(--group $group)
          done

          cd laa-ip-allowlist
          ALLOWLIST=$(python ./filter_cidrs.py "${GROUP_ARGS[@]}" | paste -sd "," -)
          echo "allowlist=$ALLOWLIST" >> "$GITHUB_OUTPUT"

  ecr:
    runs-on: ubuntu-latest
    needs: get-allowlist
    environment: development
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read # This is required for actions/checkout
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Build JAR
        run: ./gradlew build -x test
        env:
          GITHUB_ACTOR: ${{ secrets.GITHUB_ACTOR }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Assume role in Cloud Platform
      - uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ secrets.ECR_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.ECR_REGION }}

      # Login to container repository
      - uses: aws-actions/amazon-ecr-login@fa648b43de3d4d023bcb3f89ed6940096949c419 # v2
        id: login-ecr

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CERT }}" > ca.crt
          kubectl config set-cluster ${KUBE_CLUSTER} --certificate-authority=./ca.crt --server=https://${KUBE_CLUSTER}
          kubectl config set-credentials deploy-user --token=${{ secrets.KUBE_TOKEN }}
          kubectl config set-context ${KUBE_CLUSTER} --cluster=${KUBE_CLUSTER} --user=deploy-user --namespace=${KUBE_NAMESPACE}
          kubectl config use-context ${KUBE_CLUSTER}
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
          KUBE_CLUSTER: ${{ secrets.KUBE_CLUSTER }}

      - name: Build and Push Docker Image to the container repository
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .

          # Tag the image per env (links with lifecycle policy of image)
          docker tag $REGISTRY/$REPOSITORY:$IMAGE_TAG $REGISTRY/$REPOSITORY:$ENV_NAME

          # Push the image to the ECR repository
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:$ENV_NAME
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          ENV_NAME: ${{ vars.ENV_NAME }}

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 'v3.21.3'

      - name: Deploy to Cloud Platform
        run: |
          helm upgrade --install laa-data-user-api deployment/helm/laa-data-user-api \
            --namespace ${KUBE_NAMESPACE} \
            -f deployment/helm/laa-data-user-api/values.yaml \
            -f deployment/helm/laa-data-user-api/values-dev.yaml \
            --set image.registry=${REGISTRY} \
            --set image.repository=${REPOSITORY} \
            --set image.tag=${IMAGE_TAG} \
            --set allowlist.enabled=true \
            --set-literal allowlist.cidr="${ALLOWLIST}" \
            --atomic \
            --timeout 7m0s
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          ALLOWLIST: ${{ needs.get-allowlist.outputs.allowlist }}
