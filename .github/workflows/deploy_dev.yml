name: Deploy Dev

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  get-allowlist:
    runs-on: ubuntu-latest
    outputs:
      allowlist: ${{ steps.generate.outputs.allowlist }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout allowlist repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ministryofjustice/laa-ip-allowlist
          ref: v1.1.0
          path: laa-ip-allowlist
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install allowlist dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Generate allowlist
        id: generate
        run: |
          set -o pipefail

          GROUP_ARGS=()
          IFS=';' read -ra GROUP_ARRAY < <(sed -n 's/^[[:space:]]*groups:[[:space:]]*"\(.*\)"[[:space:]]*$/\1/p' deployment/helm/laa-data-user-api/values-dev.yaml)
          for group in "${GROUP_ARRAY[@]}"; do
            # shellcheck disable=SC2086 # intentional word-splitting: filter_cidrs.py --group takes each tag as a separate arg
            GROUP_ARGS+=(--group $group)
          done

          cd laa-ip-allowlist
          ALLOWLIST=$(python ./filter_cidrs.py "${GROUP_ARGS[@]}" | paste -sd "," -)
          echo "allowlist=$ALLOWLIST" >> "$GITHUB_OUTPUT"

  ecr:
    runs-on: ubuntu-latest
    needs: get-allowlist
    environment: development
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read # This is required for actions/checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'corretto'
          java-version: '25'

      - name: Build JAR
        run: ./gradlew build -x test
        env:
          GITHUB_ACTOR: ${{ secrets.GITHUB_ACTOR }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ENVIRONMENT: ${{ vars.ENV_NAME }}

      # Assume role in Cloud Platform
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.ECR_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.ECR_REGION }}

      # Login to container repository
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
        id: login-ecr

      - name: Build and Push Docker Image to the container repository
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .

          # Tag the image per env (links with lifecycle policy of image)
          docker tag $REGISTRY/$REPOSITORY:$IMAGE_TAG $REGISTRY/$REPOSITORY:$ENV_NAME

          # Push the image to the ECR repository
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:$ENV_NAME
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          ENV_NAME: ${{ vars.ENV_NAME }}

  deploy:
    needs: [get-allowlist, ecr]
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read # This is required for actions/checkout
    uses: $/.github/workflows/reusable-helm-deploy.yml
    secrets:
      ECR_ROLE_TO_ASSUME: ${{ secrets.ECR_ROLE_TO_ASSUME }}
      KUBE_CERT: ${{ secrets.KUBE_CERT }}
      KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}
      KUBE_CLUSTER: ${{ secrets.KUBE_CLUSTER }}
      KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
      TECH_SERVICES_AZURE_CLIENT_ID: ${{ secrets.TECH_SERVICES_AZURE_CLIENT_ID }}
      TECH_SERVICES_TENANT_ID: ${{ secrets.TECH_SERVICES_TENANT_ID }}
      TECH_SERVICES_AZURE_CLIENT_SECRET: ${{ secrets.TECH_SERVICES_AZURE_CLIENT_SECRET }}
      TECH_SERVICES_BASE_URL: ${{ secrets.TECH_SERVICES_BASE_URL }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      AZURE_APP_URI: ${{ secrets.AZURE_APP_URI }}
    with:
      environment: development
      helm_values_env: dev
      image_tag: ${{ github.sha }}
      allowlist_cidr: ${{ needs.get-allowlist.outputs.allowlist }}
