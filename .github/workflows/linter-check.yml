name: Linter Check

on:
  pull_request:
    types: [ opened, reopened, synchronize ]
    paths:
      - '**'
      - '!**/*.md'
      - '!deployment/**'
      - '!.ash/**'
      - '!.github/workflows/**'
      - '.github/workflows/linter-check.yml'
      - '**/*.java'
      - '**/*.gradle*'
      - '**/checkstyle*.xml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-api-linter-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Run Checkstyle
    # Skip for Dependabot PRs - Dependabot does not edit Java source.
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'corretto'
          java-version: '25'

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Run Checkstyle
        run: ./gradlew checkstyleMain checkstyleTest checkStyleIntegrationTest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run OPA policy tests
        run: docker run --rm --volume "$PWD/opa:/tmp/opa:ro" openpolicyagent/opa:0.68.0 test /tmp/opa/policies /tmp/opa/tests -v

      - name: Upload Checkstyle Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checkstyle-report
          path: target/checkstyle/*
          retention-days: 15
