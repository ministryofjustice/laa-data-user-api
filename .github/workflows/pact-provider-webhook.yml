# Provider (Java / pact-jvm): verification triggered by the broker webhook.
#
# IMPORTANT: this file must be on the DEFAULT BRANCH (main) with workflow_dispatch declared,
# otherwise the broker dispatch fails (422). It also runs on PR so you catch regressions early.
name: Pact Provider Verification
run-name: Pact verify — ${{ github.event.inputs.consumer || 'push/PR' }}

on:
  workflow_dispatch:
    inputs:
      consumer:       { required: false, description: "Consumer name (from broker webhook)" }
      consumerBranch: { required: false, description: "Consumer branch (from broker webhook)" }
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  pact-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4

      - name: Verify pacts
        run: ./gradlew pactTest
        env:
          PACT_BROKER_URL:      ${{ secrets.PACT_BROKER_URL }}
          PACT_BROKER_USERNAME: ${{ secrets.PACT_BROKER_USERNAME }}
          PACT_BROKER_PASSWORD: ${{ secrets.PACT_BROKER_PASSWORD }}
          GIT_SHA:              ${{ github.sha }}
          GIT_BRANCH:           ${{ github.ref_name }}
          PACT_CONSUMER:        ${{ github.event.inputs.consumer }}
          PACT_CONSUMER_BRANCH: ${{ github.event.inputs.consumerBranch }}
