# Provider verification runs from the broker webhook, plus on PRs and main pushes.
name: Pact Provider Verification
run-name: Pact verify — ${{ github.event.inputs.consumer || 'push/PR' }}

on:
  workflow_dispatch:
    inputs:
      consumer:
        required: false
        description: Consumer name from the broker webhook
      consumerBranch:
        required: false
        description: Consumer branch from the broker webhook
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  pact-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify provider contracts
        run: ./gradlew pactTest
        env:
          PACT_BROKER_URL:      ${{ secrets.PACT_BROKER_URL }}
          PACT_BROKER_USERNAME: ${{ secrets.PACT_BROKER_USERNAME }}
          PACT_BROKER_PASSWORD: ${{ secrets.PACT_BROKER_PASSWORD }}
          GIT_SHA:              ${{ github.sha }}
          GIT_BRANCH:           ${{ github.ref_name }}
          PACT_CONSUMER:        ${{ github.event.inputs.consumer }}
          PACT_CONSUMER_BRANCH: ${{ github.event.inputs.consumerBranch }}
