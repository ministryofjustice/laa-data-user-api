name: Reusable Helm Deploy

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      environment:
        description: 'GitHub Environment name for secret/var scoping (development | test | prd)'
        type: string
        required: true
      helm_values_env:
        description: 'Suffix selecting deployment/helm/laa-data-user-api/values-<x>.yaml (dev | test | prd)'
        type: string
        required: true
      image_tag:
        description: 'Image tag to deploy (commit sha for dev, release version for release)'
        type: string
        required: true
      allowlist_cidr:
        description: 'Precomputed allowlist CIDR list (dev only; empty elsewhere)'
        type: string
        required: false
        default: ''
      wait_for_rollout:
        description: 'Run an extra kubectl rollout status check after helm upgrade'
        type: boolean
        required: false
        default: false

# No `secrets:` interface here deliberately: KUBE_*/TECH_SERVICES_*/SENTRY_DSN/
# ECR_ROLE_TO_ASSUME are GitHub Environment secrets. Environment secrets cannot cross
# the workflow_call boundary via explicit passing (GitHub ignores/ overrides passed
# values with the called job's own environment secret of the same name) - instead the
# `deploy` job below gets access to them directly because it declares
# `environment: ${{ inputs.environment }}` itself, exactly as the single-job workflows
# it replaces already did.

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read # This is required for actions/checkout
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Assume role in Cloud Platform
      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ secrets.ECR_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.ECR_REGION }}

      # Login to container repository
      - uses: aws-actions/amazon-ecr-login@fa648b43de3d4d023bcb3f89ed6940096949c419 # v2
        id: login-ecr

      - name: Configure kubectl
        uses: ./.github/actions/configure-kubectl
        with:
          kube-cert: ${{ secrets.KUBE_CERT }}
          kube-token: ${{ secrets.KUBE_TOKEN }}
          kube-cluster: ${{ secrets.KUBE_CLUSTER }}
          kube-namespace: ${{ secrets.KUBE_NAMESPACE }}

      - name: Get RDS DB identifier
        id: rds-id
        run: |
          RDS_DB_IDENTIFIER=$(kubectl get secret rds-postgresql-instance-output -n "${KUBE_NAMESPACE}" -o jsonpath='{.data.rds_instance_endpoint}' | base64 -d | cut -d. -f1)
          echo "rds_db_identifier=${RDS_DB_IDENTIFIER}" >> "$GITHUB_OUTPUT"
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}

      - name: Generate values-secrets.yaml
        # Built with `yq`'s strenv()/AST assignment rather than text substitution
        # (e.g. envsubst) because these values are secrets whose content is arbitrary -
        # a value containing a `"`, `:` or `,` would corrupt or reinterpret a
        # text-substituted YAML file. yq assigns each value as a proper YAML scalar
        # node and quotes/escapes it correctly regardless of content.
        run: |
          yq eval -n '
              .image.registry = strenv(IMAGE_REGISTRY)
            | .image.repository = strenv(IMAGE_REPOSITORY)
            | .image.tag = strenv(IMAGE_TAG)
            | .springProfile = strenv(SPRING_PROFILE)
            | .envName = strenv(ENV_NAME)
            | .sentryEnvironment = strenv(ENV_NAME)
            | .sentryDsn = strenv(SENTRY_DSN)
            | .rdsDbIdentifier = strenv(RDS_DB_IDENTIFIER)
            | .techServicesAzureScope = strenv(TECH_SERVICES_AZURE_SCOPE)
            | .techServicesAzureClientId = strenv(TECH_SERVICES_AZURE_CLIENT_ID)
            | .techServicesTenantId = strenv(TECH_SERVICES_TENANT_ID)
            | .techServicesAzureClientSecret = strenv(TECH_SERVICES_AZURE_CLIENT_SECRET)
            | .techServicesBaseUrl = strenv(TECH_SERVICES_BASE_URL)
            | .allowlist.cidr = strenv(ALLOWLIST_CIDR)
          ' > deployment/helm/laa-data-user-api/values-secrets.generated.yaml
        env:
          IMAGE_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          SPRING_PROFILE: ${{ vars.SPRING_PROFILE }}
          ENV_NAME: ${{ vars.ENV_NAME }}
          RDS_DB_IDENTIFIER: ${{ steps.rds-id.outputs.rds_db_identifier }}
          TECH_SERVICES_AZURE_SCOPE: ${{ vars.TECH_SERVICES_AZURE_SCOPE }}
          TECH_SERVICES_AZURE_CLIENT_ID: ${{ secrets.TECH_SERVICES_AZURE_CLIENT_ID }}
          TECH_SERVICES_TENANT_ID: ${{ secrets.TECH_SERVICES_TENANT_ID }}
          TECH_SERVICES_AZURE_CLIENT_SECRET: ${{ secrets.TECH_SERVICES_AZURE_CLIENT_SECRET }}
          TECH_SERVICES_BASE_URL: ${{ secrets.TECH_SERVICES_BASE_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          ALLOWLIST_CIDR: ${{ inputs.allowlist_cidr }}

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: 'v3.21.3'

      - name: Deploy to Cloud Platform
        run: |
          helm upgrade --install laa-data-user-api deployment/helm/laa-data-user-api \
            --namespace "${KUBE_NAMESPACE}" \
            -f deployment/helm/laa-data-user-api/values.yaml \
            -f "deployment/helm/laa-data-user-api/values-${HELM_VALUES_ENV}.yaml" \
            -f deployment/helm/laa-data-user-api/values-secrets.generated.yaml \
            --atomic \
            --timeout 7m0s
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
          HELM_VALUES_ENV: ${{ inputs.helm_values_env }}

      - name: Wait for new deployment to finish
        if: inputs.wait_for_rollout
        run: |
          kubectl -n "${KUBE_NAMESPACE}" rollout status deployment laa-data-user-api --timeout=7m
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
