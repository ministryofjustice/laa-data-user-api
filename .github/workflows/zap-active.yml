name: ZAP Active Scan (Data User API)

on:
  schedule:
    - cron: '0 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: zap-active-${{ github.ref }}
  cancel-in-progress: false

jobs:
  zap_active_scan:
    name: Isolated ${{ matrix.scan }} scan
    runs-on: ubuntu-latest
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        scan: [read, write, anonymous]

    env:
      APP_URL: http://localhost:8080
      SCAN_MODE: ${{ matrix.scan }}
      SCAN_NAMESPACE: zap-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.scan }}
      ZAP_TEST_OID: 00000000-0000-0000-0000-000000000001
      ZAP_TEST_FIRM_CODE: '900001'
      ZAP_AUTH_TOKEN: ${{ matrix.scan != 'anonymous' && format('oid__00000000-0000-0000-0000-000000000001_scope__{0}', matrix.scan == 'write' && 'user_data.admin' || 'user_data.read') || '' }}
      POSTGRES_IMAGE: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
      APP_IMAGE: amazoncorretto:25-alpine@sha256:e3ec06bdc025f54f1dbeeb92a8cc537665371badec999ce832c1cb6c00a2c828
      LIQUIBASE_IMAGE: liquibase/liquibase:4.33.0@sha256:e116c935ba22b59a22165207f65c268e363269de30bb1fedacff3755c2abaa8c
      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:stable@sha256:5ccfff9a411743ab2615136a2edd7416bec9ce41572fa94e935df38c14adb2b6

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout shared database migrations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ministryofjustice/laa-landing-page
          ref: 1704ab9d8836e3ab9ed189f945298dca738604da
          path: shared-schema
          sparse-checkout: src/main/resources/db/changelog
          persist-credentials: false

      - name: Test scan helpers
        run: python3 -B -m unittest discover -s .github/scripts -p 'test_zap_*.py'

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build the API before network isolation
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew bootJar --no-daemon

      - name: Pull runtime images before network isolation
        run: |
          docker pull "$POSTGRES_IMAGE"
          docker pull "$APP_IMAGE"
          docker pull "$LIQUIBASE_IMAGE"
          docker pull "$ZAP_IMAGE"

      - name: Prepare ZAP plan
        run: |
          mkdir -p build/zap
          ruby .github/scripts/zap_prepare_plan.rb
          chmod 777 build/zap

      - name: Start and verify the isolated scan environment
        run: bash .github/scripts/zap_start_environment.sh

      - name: Check scan baseline
        run: |
          trap 'if [ -f build/zap/baseline-summary.md ]; then cat build/zap/baseline-summary.md >> "$GITHUB_STEP_SUMMARY"; fi' EXIT
          docker run --rm --pull=never --network "container:${SCAN_NAMESPACE}-db" \
            --cap-drop ALL --security-opt no-new-privileges \
            -e SCAN_MODE -e ZAP_AUTH_TOKEN \
            -e ZAP_WORK_DIR=/zap/wrk \
            -e GITHUB_STEP_SUMMARY=/zap/wrk/baseline-summary.md \
            -v "$PWD/build/zap:/zap/wrk:rw" -w /zap/wrk \
            -v "$PWD/.github/scripts:/checks:ro" --entrypoint python3 \
            "$ZAP_IMAGE" /checks/zap_scan_baseline.py
          if [ "$SCAN_MODE" = write ]; then
            docker exec "${SCAN_NAMESPACE}-db" psql -U zap -d zap --set ON_ERROR_STOP=1 \
              -c "UPDATE entra_user SET multi_firm_user = false WHERE entra_oid = '00000000-0000-0000-0000-000000000006'"
          fi

      - name: Run ZAP active scan
        id: zap_scan
        run: |
          docker run --rm --pull=never --name "${SCAN_NAMESPACE}-zap" \
            --network "container:${SCAN_NAMESPACE}-db" \
            --cap-drop ALL --security-opt no-new-privileges \
            -v "$PWD/build/zap:/zap/wrk:rw" \
            "$ZAP_IMAGE" \
            zap.sh -cmd -port 8090 -autorun /zap/wrk/plan.yaml

      - name: Check access after scanning
        id: auth_check
        if: ${{ always() && steps.zap_scan.outcome != 'skipped' }}
        run: |
          trap 'if [ -f build/zap/post-baseline-summary.md ]; then cat build/zap/post-baseline-summary.md >> "$GITHUB_STEP_SUMMARY"; fi' EXIT
          docker run --rm --pull=never --network "container:${SCAN_NAMESPACE}-db" \
            --cap-drop ALL --security-opt no-new-privileges \
            -e SCAN_MODE -e ZAP_AUTH_TOKEN -e BASELINE_PHASE=post \
            -e ZAP_WORK_DIR=/zap/wrk \
            -e GITHUB_STEP_SUMMARY=/zap/wrk/post-baseline-summary.md \
            -v "$PWD/build/zap:/zap/wrk:rw" -w /zap/wrk \
            -v "$PWD/.github/scripts:/checks:ro" --entrypoint python3 \
            "$ZAP_IMAGE" /checks/zap_scan_baseline.py

      - name: Summarise findings
        if: ${{ always() && hashFiles('build/zap/zap-active-report.json') != '' }}
        env:
          AUTH_STATUS: ${{ steps.auth_check.outcome }}
        run: |
          trap 'rm -f build/zap/sites-tree.yaml build/zap/sites-tree.json' EXIT
          if [ -f build/zap/sites-tree.yaml ]; then
            ruby -r yaml -r json -e 'puts JSON.generate(YAML.load_file(ARGV[0]))' \
              build/zap/sites-tree.yaml > build/zap/sites-tree.json
          fi
          python3 .github/scripts/zap_active_summary.py
          cat build/zap/zap-active-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Check Slack notification configuration
        id: slack_config
        if: ${{ github.event_name == 'schedule' }}
        env:
          ZAP_SLACK_WEBHOOK_URL: ${{ secrets.ZAP_SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$ZAP_SLACK_WEBHOOK_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Slack notification skipped: no repository or organization webhook is configured."
          fi

      - name: Post active scan summary to Slack
        if: ${{ always() && github.event_name == 'schedule' && steps.slack_config.outputs.configured == 'true' && hashFiles('build/zap/zap-active-report.json') != '' }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.ZAP_SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "ZAP Active Scan: ${{ github.event.repository.name }} - ${{ matrix.scan }}"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Scan step:* ${{ steps.zap_scan.outcome }}\n*Findings (alert instances):*\n• High: ${{ env.ZAP_HIGH_INSTANCES }} (${{ env.ZAP_HIGH_TYPES }} alert types)\n• Medium: ${{ env.ZAP_MEDIUM_INSTANCES }} (${{ env.ZAP_MEDIUM_TYPES }} alert types)\n• Low: ${{ env.ZAP_LOW_INSTANCES }} (${{ env.ZAP_LOW_TYPES }} alert types)\n• Informational: ${{ env.ZAP_INFO_INSTANCES }} (${{ env.ZAP_INFO_TYPES }} alert types)\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View full report and coverage>"
                  }
                }
              ]
            }

      - name: Collect logs and remove isolated containers
        if: ${{ always() }}
        run: |
          mkdir -p build/zap
          cleanup_status=0
          for role in zap app migrations db; do
            name="${SCAN_NAMESPACE}-${role}"
            existing=$(docker container ls --all --filter "name=^/${name}$" --format '{{.ID}}')
            if [ -n "$existing" ]; then
              if ! docker logs "$name" > "build/zap/${role}.log" 2>&1; then
                echo "::warning::Could not collect logs for $name."
              fi
              if ! docker rm --force --volumes "$name"; then
                cleanup_status=1
              fi
            fi
          done
          exit "$cleanup_status"

      - name: Upload ZAP reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-active-report-${{ matrix.scan }}
          path: |
            build/zap/zap-active-report.*
            build/zap/zap-active-summary.md
            build/zap/zap-active-endpoints.txt
            build/zap/zap-active-query-patterns.md
            build/zap/zap-baseline.md
            build/zap/zap-post-baseline.md
            build/zap/app.log
          if-no-files-found: warn
          retention-days: 14
