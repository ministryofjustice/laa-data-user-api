name: Helm Lint

on:
  pull_request:
    paths:
      - 'deployment/helm/**'
      - '.github/workflows/reusable-helm-deploy.yml'
      - '.github/workflows/helm-lint.yml'
      - '.github/scripts/test_opa_deploy.py'
      - 'opa/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-api-helm-lint-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and Template Helm Chart (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, test, prd]

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: 'v3.21.3'

      - name: Helm Lint
        run: |
          helm lint deployment/helm/laa-data-user-api \
            -f deployment/helm/laa-data-user-api/values.yaml \
            -f deployment/helm/laa-data-user-api/values-${ENVIRONMENT}.yaml \
            --set-string opa.bundleRef=test \
            --set-string opa.bundleData=test
        env:
          ENVIRONMENT: ${{ matrix.environment }}

      - name: Helm Template
        run: |
          helm template deployment/helm/laa-data-user-api \
            -f deployment/helm/laa-data-user-api/values.yaml \
            -f deployment/helm/laa-data-user-api/values-${ENVIRONMENT}.yaml \
            --set image.registry=example.com \
            --set image.repository=laa-data-user-api \
            --set image.tag=test \
            --set rdsDbIdentifier=test-rds-id \
            --set envName=${ENVIRONMENT} \
            --set-string opa.bundleRef=test \
            --set-string opa.bundleData=test > /dev/null
        env:
          ENVIRONMENT: ${{ matrix.environment }}

      - name: Test OPA deployment
        if: matrix.environment == 'dev'
        run: python3 .github/scripts/test_opa_deploy.py
        env:
          TEST_REAL_DOCKER: '1'
