name: Publish silas-contracts

on:
  push:
    tags:
      - 'silas-contracts-v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#silas-contracts-v}" >> "$GITHUB_OUTPUT"

      - name: Build and publish silas-contracts
        run: ./gradlew :silas-contracts:publish -PcontractsVersion=${{ steps.version.outputs.VERSION }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
