openapi: 3.0.3
info:
  title: LAA User Data API
  description: |
    LAA User Data API

    This API provides access to user account and profile data for Legal Aid Agency (LAA) users. 

    Notes for consumers:
    - Users can have multiple profiles, each of which will belong to a different provider firm. When working with external users, the profile ID MUST be used to identify the user, as the Entra Object ID is shared across all profiles for a given user.
    - The Provider Data endpoints are temporary and will be replaced by PDAv2. They are provided for consumption by the Manage Your Users service only. Consumers should not rely on these endpoints for any other purpose and should use PDA instead.


  version: 1.0.0
  contact:
    name: LAA SiLAS Team #laa-silas-idam

servers:
  - url: /
    description: Relative to deployment host

security:
  - entraIdOAuth: ["api://user-data/user.read"]

tags:
  - name: User Account
    description: Commands and queries used for the management of User Account (`entra_user`)
  - name: User Profiles
    description: Commands and queries used for the management of user profiles including assigning roles and offices (`user_profile`, junction tables)
  - name: Provider Data
    description: Temporary endpoints which expose firms and offices to support user management. Will be replaced by PDAv2. (`firm`, `office`)
  - name: Application & Role Management
    description: Apps, roles, permissions, and assignments (`app`, `app_role`, `role_assignment`)
  - name: User Account Security Audit & Management
    description: Allows security users to view audit data and bulk disable users as required (`user_account_status_audit`, reason tables)
  - name: Admin Triggers
    description: Operational commands triggered by system administrators

paths:
  # --- User Account queries ---
  /api/v1/queries/users:
    get:
      operationId: queryUsersSearch
      tags: [User Account]
      summary: Search SiLAS users
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/UserType'
        - $ref: '#/components/parameters/UserAccountStatus'
        - $ref: '#/components/parameters/UserQuery'
        - $ref: '#/components/parameters/FirmQuery'
        - $ref: '#/components/parameters/FirmIdFilter'
        - $ref: '#/components/parameters/AppIdFilter'
        - $ref: '#/components/parameters/AppRoleIdFilter'
        - name: neverActivatedFilter
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Paginated user search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAccountSummaryPage'

  /api/v1/queries/users/{userEntraObjectId}:
    get:
      operationId: queryUserById
      tags: [User Account]
      summary: Get SiLAS User Account by Entra Object ID
      parameters:
        - $ref: '#/components/parameters/UserEntraObjectId'
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserView'
        '404':
          $ref: '#/components/responses/NotFound'

  # --- User profile queries ---
  /api/v1/queries/users/{userEntraObjectId}/profiles:
    get:
      operationId: queryUserProfilesByEntraUser
      tags: [User Profiles]
      summary: List profiles for an Entra user
      parameters:
        - $ref: '#/components/parameters/UserEntraObjectId'
      responses:
        '200':
          description: Profile list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileSummaryList'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/queries/users/{userEntraObjectId}/active-profile:
    get:
      operationId: queryActiveProfileByEntraUser
      tags: [User Profiles]
      summary: Get active profile for Entra user
      parameters:
        - $ref: '#/components/parameters/UserEntraObjectId'
      responses:
        '200':
          description: Details for active profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileDetailView'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/queries/user-profiles:
    get:
      operationId: queryUserProfilesSearch
      tags: [User Profiles]
      summary: Search user profiles
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/UserType'
        - $ref: '#/components/parameters/UserProfileStatus'
        - $ref: '#/components/parameters/AppIdFilter'
        - $ref: '#/components/parameters/AppRoleIdFilter'
        - $ref: '#/components/parameters/OfficeIdFilter'
        - $ref: '#/components/parameters/FirmIdFilter'
        - $ref: '#/components/parameters/UserQuery'
        - $ref: '#/components/parameters/FirmQuery'
        
        - name: firmAdminFilter
          in: query
          schema:
            type: boolean
            default: false
        - name: multiFirmUsersFilter
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Paginated profile search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileSummaryPage'

  /api/v1/queries/user-profiles/{userProfileId}:
    get:
      operationId: queryUserProfileById
      tags: [User Profiles]
      summary: Get user profile detail
      parameters:
        - $ref: '#/components/parameters/UserProfileId'
      responses:
        '200':
          description: User profile detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileDetailView'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/queries/user-profiles/{userProfileId}/app-roles:
    get:
      operationId: queryUserProfileAppRoles
      tags: [User Profiles]
      summary: Get all app roles for profile
      parameters:
        - $ref: '#/components/parameters/UserProfileId'
        - $ref: '#/components/parameters/AppIdFilter'
      responses:
        '200':
          description: App roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppRoleViewList'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/queries/user-profiles/{userProfileId}/apps:
    get:
      operationId: queryUserProfileApps
      tags: [User Profiles]
      summary: Get all apps for profile
      parameters:
        - $ref: '#/components/parameters/UserProfileId'
      responses:
        '200':
          description: Applications for user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppViewList'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/queries/user-profiles/{userProfileId}/offices:
    get:
      operationId: queryUserProfileOffices
      tags: [User Profiles]
      summary: Get offices for profile
      parameters:
        - $ref: '#/components/parameters/UserProfileId'
      responses:
        '200':
          description: Offices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficeViewList'
        '404':
          $ref: '#/components/responses/NotFound'


  # --- Provider data queries ---
  /api/v1/queries/firms:
    get:
      operationId: queryFirms
      tags: [Provider Data]
      summary: Get list of firms, with pagination and query field.
      security: 
        - entraIdOAuth: ["api://user-data/user.admin"]
      parameters:
        - $ref: '#/components/parameters/FirmQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Firm
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirmViewPage'

  /api/v1/queries/firms/{firmId}:
    get:
      operationId: queryFirmById
      tags: [Provider Data]
      summary: Get firm by ID
      security: 
        - entraIdOAuth: ["api://user-data/user.admin"]
      parameters:
        - $ref: '#/components/parameters/FirmId'
      responses:
        '200':
          description: Firm
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirmView'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/queries/firms/search:
    get:
      operationId: queryFirmsSearch
      tags: [Provider Data]
      summary: Type-ahead search for firms, returns a list of firms to be used for identifying firms in search boxes.
      security: 
        - entraIdOAuth: ["api://user-data/user.admin"]
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Matching firms
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirmSearchViewList'

  /api/v1/queries/firms/{firmId}/offices:
    get:
      operationId: queryFirmOffices
      tags: [Provider Data]
      summary: List offices for firm
      security: 
        - entraIdOAuth: ["api://user-data/user.admin"]
      parameters:
        - $ref: '#/components/parameters/FirmId'
      responses:
        '200':
          description: Office page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfficeViewList'
        '404':
          $ref: '#/components/responses/NotFound'

  # --- Application & Role Management queries ---
  /api/v1/queries/apps:
    get:
      operationId: queryAppsAll
      tags: [Application & Role Management]
      summary: List all apps
      responses:
        '200':
          description: Apps
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppViewList'

  /api/v1/queries/apps/{appId}:
    get:
      operationId: queryAppById
      tags: [Application & Role Management]
      summary: Get app by ID (Application client ID in Entra ID)
      parameters:
        - $ref: '#/components/parameters/AppId'
      responses:
        '200':
          description: App
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppView'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/queries/apps/{appId}/roles:
    get:
      operationId: queryAppRolesByApp
      tags: [Application & Role Management]
      summary: List roles for app
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/UserType'
      responses:
        '200':
          description: App roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppRoleViewList'

  /api/v1/queries/app-roles/{appRoleId}:
    get:
      operationId: queryAppRoleById
      tags: [Application & Role Management]
      summary: Get app role by ID
      parameters:
        - $ref: '#/components/parameters/AppRoleId'
      responses:
        '200':
          description: App role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppRoleView'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/queries/role-restrictions:
    get:
      operationId: queryRoleAssignmentRestrictions
      tags: [Application & Role Management]
      summary: List role assignment restrictions
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: appId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Role assignment restrictions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignmentRestrictionViewPage'


  # --- Audit queries ---
  /api/v1/queries/audit/users/{userEntraObjectId}:
    get:
      operationId: queryAuditUserDetail
      tags: [User Account Security Audit & Management]
      summary: Get audit user detail
      security:
        - entraIdOAuth: ["api://user-data/user.admin"]
      parameters:
        - $ref: '#/components/parameters/UserEntraObjectId'
      responses:
        '200':
          description: Audit detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditUserDetailView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/queries/audit/users/deleted:
    get:
      operationId: queryAuditUsersDeleted
      tags: [User Account Security Audit & Management]
      summary: List deleted users
      security:
        - entraIdOAuth: ["api://user-data/user.admin"]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: emailQuery
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Deleted users page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedUserAuditPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/queries/audit/users/export:
    get:
      operationId: queryAuditUsersExport
      tags: [User Account Security Audit & Management]
      summary: Export audit users CSV, must be constrained to a single firm (or internal users only)
      security:
        - entraIdOAuth: ["api://user-data/user.admin"]
      parameters:
        - $ref: '#/components/parameters/UserType'
        - $ref: '#/components/parameters/UserAccountStatus'
        - $ref: '#/components/parameters/FirmIdFilter'
        - $ref: '#/components/parameters/OfficeIdFilter'
        - $ref: '#/components/parameters/AppIdFilter'
        - $ref: '#/components/parameters/AppRoleIdFilter'
        - name: neverActivatedFilter
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: CSV export
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # --- Identity commands ---
  /api/v1/commands/users/create:
    post:
      operationId: commandUserAccountCreate
      tags: [User Account]
      summary: Create Entra user and initial profile
      security:
        - entraIdOAuth: ["api://user-data/user.admin"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserAccountCommand'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserAccountResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: User account already exists. This will return the complete user object from Entra ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserAccountResult'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /api/v1/commands/users/update-details:
    post:
      operationId: commandUserAccountUpdateDetails
      tags: [User Account]
      summary: Update User Account details
      security:
        - entraIdOAuth: ["api://user-data/user.admin"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserDetailsCommand'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /api/v1/commands/users/disable:
    post:
      operationId: commandUserAccountDisable
      tags: [User Account]
      summary: Disable SiLAS User Account
      security:
        - entraIdOAuth: ["api://user-data/user.admin"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisableUserCommand'
      responses:
        '200':
          description: User account disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /api/v1/commands/users/enable:
    post:
      operationId: commandUserAccountEnable
      tags: [User Account]
      summary: Enable User Account
      security:
        - entraIdOAuth: ["api://user-data/user.admin"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnableUserCommand'
      responses:
        '200':
          description: User account enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /api/v1/commands/users/delete:
    post:
      operationId: commandUserAccountDelete
      tags: [User Account]
      summary: Delete User Account and all associated profiles
      security:
        - entraIdOAuth: ["api://user-data/user.admin"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteUserAccountCommand'
      responses:
        '200':
          description: User account deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteUserResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /api/v1/commands/users/convert-to-multi-firm:
    post:
      operationId: commandUserAccountConvertMultiFirm
      tags: [User Account]
      summary: Convert user to multi-firm. This cannot be undone.
      security:
        - entraIdOAuth: ["api://user-data/user.admin"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConvertToMultiFirmCommand'
      responses:
        '200':
          description: User account converted to multi-firm
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/commands/users/set-active-profile:
    post:
      operationId: commandUserSetActiveProfile
      tags: [User Profiles]
      summary: Set active profile for SiLAS user account
      security:
        - entraIdOAuth: ["api://user-data/user.admin"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetActiveProfileCommand'
      responses:
        '200':
          description: Active profile set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # --- User profile commands ---
  /api/v1/commands/user-profiles/create:
    post:
      operationId: commandUserProfileCreate
      tags: [User Profiles]
      summary: Create user profile
      security:
        - entraIdOAuth: ["api://user-data/user.admin"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserProfileCommand'
      responses:
        '201':
          description: Profile created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserProfileResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/commands/user-profiles/assign-app-roles:
    post:
      operationId: commandUserProfileAssignAppRoles
      tags: [User Profiles]
      summary: Assign app roles to profile
      security:
        - entraIdOAuth: ["api://user-data/user.admin"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignAppRolesCommand'
      responses:
        '200':
          description: Roles assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/commands/user-profiles/remove-app-roles:
    post:
      operationId: commandUserProfileRemoveAppRoles
      tags: [User Profiles]
      summary: Remove app roles from profile
      security:
        - entraIdOAuth: ["api://user-data/user.admin"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveAppRolesCommand'
      responses:
        '200':
          description: Roles removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/commands/user-profiles/update-app-roles:
    post:
      operationId: commandUserProfileUpdateAppRoles
      tags: [User Profiles]
      summary: Updates roles for a specified set of apps
      security:
        - entraIdOAuth: ["api://user-data/user.admin"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAppRolesCommand'
      responses:
        '200':
          description: App roles updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateAppRolesResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/commands/user-profiles/update-offices:
    post:
      operationId: commandUserProfileUpdateOffices
      tags: [User Profiles]
      summary: Update offices for profile
      security:
        - entraIdOAuth: ["api://user-data/user.admin"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/UpdateOfficesCommand'
