components:
  securitySchemes:
    entraIdOAuth:
      type: oauth2
      description: Entra ID OAuth 2.0 authentication. Use 'user.read' scope for LAA apps reading user profiles. Use 'user.admin' scope for user administration services with full endpoint access.
      flows:
        authorizationCode:
          authorizationUrl: https://login.microsoftonline.com/{tenant-id}/oauth2/v2.0/authorize
          tokenUrl: https://login.microsoftonline.com/{tenant-id}/oauth2/v2.0/token
          scopes:
            api://user-data/user.read: Read user account and profile details
            api://user-data/user.admin: Full administrative access to all endpoints
            api://user-data/system.admin: Privileged administrative access to initiate system functions
        clientCredentials:
          tokenUrl: https://login.microsoftonline.com/{tenant-id}/oauth2/v2.0/token
          scopes:
            api://user-data/user.read: Read user account and profile details
            api://user-data/user.admin: Full administrative access to all endpoints

  parameters:
    UserEntraObjectId:
      name: userEntraObjectId
      description: The Entra Object ID for the user. This is a GUID and is the unique identifier for the user in Entra.
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserProfileId:
      name: userProfileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FirmQuery:
      name: firmQuery
      description: Search term to filter firms by name and ID. This is a case-insensitive search and will return all firms that contain the search term in either their name or ID.
      in: query
      schema:
        type: string
    FirmId:
      name: firmId
      description: The firm number for each firm. This is numerical key and is shared with PDA.
      in: path
      required: true
      schema:
        type: string
    FirmIdFilter:
      name: firmId
      description: The firm number for each firm. This is numerical key and is shared with PDA. Used to filter user results to only show users with this firm assigned.
      in: query
      schema:
        type: string
    OfficeIdFilter:
      name: officeId
      description: The office account number for the office. This is a 5 or 6 digit key.
      in: query
      schema:
        type: string
    AppId:
      name: appId
      description: Identifier for the application. This uses the Entra client ID.
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AppRoleId:
      name: appRoleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AppIdFilter:
      name: appId
      description: Identifier for the application. This uses the Entra client ID. Used to filter user results to only show users with this app assigned.
      in: query
      schema:
        type: string
        format: uuid
    AppRoleIdFilter:
      name: appRoleId
      description: Identifier for the application role. This uses the SiLAS ID. Used to filter user results to only show users with this role assigned.
      in: query
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      schema:
        type: string
    UserQuery:
      name: userQuery
      in: query
      schema:
        type: string
    UserType:
      name: userType
      in: query
      schema:
        $ref: '#/components/schemas/UserType'
    UserAccountStatus:
      name: userAccountStatus
      in: query
      schema:
        $ref: '#/components/schemas/UserAccountStatus'
    UserProfileStatus:
      name: userProfileStatus
      in: query
      schema:
        $ref: '#/components/schemas/UserProfileStatus'

  responses:
    BadRequest:
      description: Validation error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Missing or invalid access token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: Token lacks required scope or user lacks lower level granular permissions.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: Conflict with current resource state
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    UnprocessableEntity:
      description: Well-formed but semantically invalid (e.g. role not allowed for user type)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    BadGateway:
      description: Entra ID returned an invalid or unexpected response
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ServiceUnavailable:
      description: Entra ID is unreachable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    GatewayTimeout:
      description: Entra ID did not respond in time
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

  schemas:
    ProblemDetail:
      type: object
      description: RFC 7807 problem detail
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri

    CommandResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        message:
          type: string

    PageMetadata:
      type: object
      properties:
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    AppRoleUserType:
      type: string
      enum: ["INTERNAL", "EXTERNAL", "BOTH"]

    UserType:
      type: string
      enum: ["INTERNAL", "EXTERNAL"]

    UserAccountStatus:
      type: string
      enum: ["ACTIVE", "DEACTIVATED", "ACTIVATION REQUIRED"]

    UserProfileStatus:
      type: string
      enum: ["COMPLETE", "NO ROLES ASSIGNED", "ACTIVATION REQUIRED"]

    FirmType:
      type: string
      enum: ["ADVOCATE", "CHAMBERS", "LEGAL_SERVICES_PROVIDER"]

    DeleteUserReason:
      type: string
      enum: ["CyberRisk", "LeftFirm", "ProviderDiscretion", "ContractEnded", "RoleChangeorNoLongerRequired", "FirmClosureorMerger", "ComplianceBreach", "DuplicateAccount", "UserRequest", "SystemIssue", "ExpiredInvitation", "NotActiveAfterMaxLifetime", "NoGroupsDelete"]

    DisableUserReason:
      type: string
      enum: [ "Absence", "ComplianceBreach", "ContractEnded", "CyberRisk", "DuplicateAccount", "FirmClosureorMerger", "InvestigationPending", "RoleChangeorNoLongerRequired", "UserRequest", "Inactivity", "ProviderDiscretion", "NotActive", "PendingAcceptance" ]

    # --- Query views ---
    UserAccountSummaryView:
      type: object
      description: Summary view of User Account (entra_user), does not contain any profile information
      required: [ userEntraObjectId, email, firstName, lastName, accountStatus ]
      properties:
        userEntraObjectId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        accountStatus:
          $ref: '#/components/schemas/UserAccountStatus'
        multiFirmUser:
          type: boolean
        mailOnly:
          type: boolean
        lastSyncedOn:
          type: string
          format: date-time
        createdDate:
          type: string
          format: date-time
        lastModifiedDate:
          type: string
          format: date-time
        profileCount:
          type: integer
          format: int32

    UserView:
      type: object
      description: Complete user view containing both the User Account and their active profile (including roles and offices)
      required: [ userAccount, activeProfile ]
      properties:
        userAccount:
          $ref: '#/components/schemas/UserAccountSummaryView'
        activeProfile:
          $ref: '#/components/schemas/UserProfileDetailView'

    UserAccountSummaryPage:
      type: object
      required: [ items, page ]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserAccountSummaryView'
        page:
          $ref: '#/components/schemas/PageMetadata'

    UserProfileSummaryView:
      type: object
      description: List/search projection for user_profile + entra_user
      required: [ userProfileId, userType, email, fullName, accountStatus, profileStatus, hasAppRoles ]
      properties:
        userProfileId:
          type: string
          format: uuid
        activeProfile:
          type: boolean
        userType:
          $ref: '#/components/schemas/UserType'
        email:
          type: string
          format: email
        fullName:
          type: string
        firmName:
          type: string
        firmId:
          type: string
        multiFirmUser:
          type: boolean
        accountStatus:
          $ref: '#/components/schemas/UserAccountStatus'
        profileStatus:
          $ref: '#/components/schemas/UserProfileStatus'
        hasAppRoles:
          type: boolean

    UserProfileSummaryList:
      type: object
      description: List of profile summaries, used for non-paginated contexts e.g. multi-firm user profile switcher
      required: [ items ]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserProfileSummaryView'

    UserProfileSummaryPage:
      type: object
      required: [ items, page ]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserProfileSummaryView'
        page:
          $ref: '#/components/schemas/PageMetadata'

    UserProfileDetailView:
      type: object
      description: Read model for user_profile + entra_user + app_roles + offices
      required: [ userProfileId, userType, email, fullName, accountStatus, profileStatus, hasAppRoles ]
      allOf:
        - $ref: '#/components/schemas/UserProfileSummaryView'
        - type: object
          properties:
            userEntraObjectId:
              type: string
              format: uuid
            unrestrictedOfficeAccess:
              type: boolean
            lastSyncSuccessful:
              type: boolean
            roles:
              type: array
              items:
                $ref: '#/components/schemas/AppRoleView'
            offices:
              type: array
              items:
                $ref: '#/components/schemas/OfficeView'

    FirmView:
      type: object
      description: Read model for firm
      required: [ firmId, name, type ]
      properties:
        firmId:
          type: string
        name:
          type: string
        type:
          $ref: '#/components/schemas/FirmType'
        parentFirmId:
          type: string
        enabled:
          type: boolean

    FirmViewPage:
      type: object
      required: [ items, page ]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FirmView'
        page:
          $ref: '#/components/schemas/PageMetadata'

    FirmSearchView:
      type: object
      description: Read model for firm type-ahead search
      required: [ firmId, name ]
      properties:
        firmId:
          type: string
        name:
          type: string

    FirmSearchViewList:
      type: object
      required: [ items ]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FirmSearchView'      

    OfficeView:
      type: object
      description: Read model for office
      required: [ officeId, firmId ]
      properties:
        officeId:
          type: string
        firmId:
          type: string
        postCode:
          type: string
        addressLine1:
          type: string
        addressLine2:
          type: string
        addressLine3:
          type: string
        city:
          type: string

    OfficeViewList:
      type: object
      required: [ items ]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OfficeView'

    AppView:
      type: object
      description: Read model for app
      required: [ appId, name, description, url, enabled, ordinal, appEntraObjectId ]
      properties:
        appId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        url:
          type: string
        enabled:
          type: boolean
        ordinal:
          type: integer
        appEntraObjectId:
          type: string

    AppViewList:
      type: object
      required: [ items ]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AppView'

    AppRoleView:
      type: object
      description: Read model for app_role
      required: [ appRoleId, appId, name, description, authzRole, legacySync, ordinal, appRoleUserTypeRestriction ]
      properties:
        appRoleId:
          type: string
          format: uuid
        appId:
          type: string
          format: uuid
        appName:
          type: string
        name:
          type: string
        description:
          type: string
        authzRole:
          type: boolean
        ccmsCode:
          type: string
        legacySync:
          type: boolean
        ordinal:
          type: integer
        appRoleUserTypeRestriction:
          $ref: '#/components/schemas/AppRoleUserType'
        firmTypeRestriction:
          type: array
          items:
            $ref: '#/components/schemas/FirmType'

    AppRoleViewList:
      type: object
      required: [ items ]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AppRoleView'

    RoleAssignmentRestrictionView:
      type: object
      description: Read model for role assignment restrictions
      required: [ appRoleId, appRoleName, appId, appName, assigningAppRoleId, assigningAppRoleName ]
      properties:
        appRoleId:
          type: string
          format: uuid
        appRoleName:
          type: string
        appId:
          type: string
          format: uuid
        appName:
          type: string
        assigningAppRoleId:
          type: string
          format: uuid
        assigningAppRoleName:
          type: string
    
    RoleAssignmentRestrictionViewPage:
      type: object
      required: [ items, page ]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoleAssignmentRestrictionView'
        page:
          $ref: '#/components/schemas/PageMetadata'

    AuditUserDetailView:
      type: object
      required: [ entraUser, profiles, accountStatusHistory ]
      properties:
        entraUser:
          allOf:
            - $ref: '#/components/schemas/UserAccountSummaryView'
            - type: object
              properties:
